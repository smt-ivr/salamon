name: Android app

# Builds the Salamon Android app and publishes it as the release "android".
# Download link: https://smti.uk/salamon/app
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (notifications while the app is closed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase: on"
          elif [ -f app/google-services.json ]; then
            echo "Firebase: on (file in the repository)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set - the app is built without notifications while closed"
          fi

      - name: Signing key
        env:
          KS_B64: ${{ secrets.SALAMON_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SALAMON_KEYSTORE_PASSWORD }}
          APK_BUILD_SECRET: ${{ secrets.APK_BUILD_SECRET }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"; PASS="$KS_PASS"; ALIAS=salamon
          elif [ -n "$APK_BUILD_SECRET" ]; then
            # The same permanent key the app builder at smti.uk/apk uses, so updates always install.
            curl -fsS -H "Authorization: Bearer $APK_BUILD_SECRET" https://smti.uk/apk/builder/keystore -o ks.json
            if [ "$(jq -r '.none // false' ks.json)" = "true" ]; then echo "::error::No key stored yet at smti.uk/apk"; exit 1; fi
            jq -r .keystore ks.json | base64 -d > "$KS"; PASS=$(jq -r .password ks.json); ALIAS=smt; rm -f ks.json
          else
            echo "::error::Set the secret APK_BUILD_SECRET (same value as in the apk repository)"; exit 1
          fi
          echo "::add-mask::$PASS"
          { echo "KEYSTORE_FILE=$KS"; echo "KEYSTORE_PASSWORD=$PASS"; echo "KEY_ALIAS=$ALIAS"; } >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/salamon.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "אפליקציית אנדרואיד" --notes "הורדה: https://smti.uk/salamon/app" --latest=false
          gh release upload android "$RUNNER_TEMP/salamon.apk" --clobber
          gh release edit android --notes "גרסה 1.${{ github.run_number }} · הורדה: https://smti.uk/salamon/app"
